/* ==== design v2 (2026-10-27) ==== */
:root{--al:50%;--floor-a:#ebbd82;--floor-b:#d9a266;--floor-grain:rgba(120,70,20,.07);--floor-line:#ffffffd9;--kc-bg:#f1f5f9;--kc-fg:#334155;--kc-line:#94a3b8}
/* 점수판: 팀 색 하단선, 득점 시 숫자 강조 */
.scoreboard{background:linear-gradient(180deg,var(--surface),var(--surface-2));border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--home) 0 50%,var(--away) 50% 100%) 1}
.sb-score{box-shadow:inset 0 -3px 0 #0000001a}
@keyframes vb-bump{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){.sb-score.vb-bump{animation:vb-bump .45s ease-out}}
/* 버튼: 입체감, 득점/범실 강조 */
.btn{transition:transform .08s ease,box-shadow .12s ease,background .12s ease}
.btn.action{position:relative;border-radius:14px;box-shadow:0 2px 0 #0f172a1a,var(--shadow)}
.btn.action:active:not(:disabled){box-shadow:0 0 0 #0f172a1a;transform:translateY(2px) scale(.99)}
.btn.action.good{background:linear-gradient(180deg,#ecfdf3,var(--good-soft));box-shadow:0 2px 0 #16a34a40,var(--shadow)}
.btn.action.danger{background:linear-gradient(180deg,#fff1f1,var(--bad-soft));box-shadow:0 2px 0 #dc262640,var(--shadow)}
.btn.small,.btn.undo{position:relative}
/* 단축키 표시 */
.btn[data-kc]::after{content:attr(data-kc);position:absolute;top:5px;right:6px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;font:700 11px/15px Consolas,"Cascadia Mono",monospace;text-align:center;color:var(--kc-fg);background:var(--kc-bg);border:1px solid var(--kc-line);border-bottom-width:2px;border-radius:5px;pointer-events:none}
.btn.small[data-kc]::after,.btn.undo[data-kc]::after,.help-btn[data-kc]::after{top:-8px;right:-5px;min-width:16px;height:16px;font-size:10px;line-height:13px;box-shadow:0 1px 2px #0f172a33;z-index:2}
.court-buttons .btn[data-kc]{overflow:visible}
.btn:disabled[data-kc]::after{opacity:.5}
@media (max-width:1100px),(max-height:800px){.btn.action[data-kc]::after{top:3px;right:4px;min-width:15px;height:15px;font-size:10px;line-height:12px}}
/* 체육관 바닥 코트 */
.court-surface{background:repeating-linear-gradient(90deg,var(--floor-grain) 0 1px,transparent 1px 26px),repeating-linear-gradient(0deg,#ffffff0f 0 2px,transparent 2px 14px),linear-gradient(160deg,var(--floor-a),var(--floor-b));border-color:var(--floor-line);outline:1px solid #78461459;box-shadow:inset 0 0 22px #78461433}
.court-cell{z-index:1;box-shadow:0 1px 2px #0f172a2e;transition:box-shadow .15s ease,transform .08s ease}
.court-cell:active{transform:scale(.97)}
.court-cell.selected.home{box-shadow:0 0 0 3px #ffffffcc,0 0 0 6px var(--home),0 8px 18px #2563eb66}
.court-cell.selected.away{box-shadow:0 0 0 3px #ffffffcc,0 0 0 6px var(--away),0 8px 18px #ea580c66}
.court-cell.server:not(.selected){box-shadow:0 0 0 2px var(--serve),0 2px 6px #d9770659}
/* 포지션 뱃지 색 */
.court-role{padding:0 6px;border-radius:999px;background:var(--rb,#fef3c7);color:var(--rf,#92400e);letter-spacing:.2px}
.court-role[data-r="OH"]{--rb:#dbeafe;--rf:#1d4ed8}
.court-role[data-r="OP"]{--rb:#fee2e2;--rf:#b91c1c}
.court-role[data-r="MB"]{--rb:#dcfce7;--rf:#15803d}
.court-role[data-r="S"]{--rb:#ede9fe;--rf:#6d28d9}
.court-role[data-r="L"]{--rb:#ccfbf1;--rf:#0f766e}
.court-cell.selected .court-role{background:#ffffff38;color:#fff}
/* 탭, 영상 빈 칸 */
.tab{display:flex;align-items:center;justify-content:center;gap:8px}
.tab::before{font-size:18px;line-height:1}
.tab:nth-child(1)::before{content:"📝"}.tab:nth-child(2)::before{content:"👥"}.tab:nth-child(3)::before{content:"📊"}
.vb-drop{background:linear-gradient(180deg,var(--surface-2),var(--bg));color:var(--muted);border-radius:14px}
/* 다크 모드 토글 */
.vb-theme-btn{min-height:42px;min-width:42px;padding:0 10px;font-size:18px;line-height:1}
.vb-theme-btn::after{display:none!important}
/* ===== 다크 테마 ===== */
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--surface:#111a2c;--surface-2:#16213a;--line:#24324d;--line-strong:#374a70;--text:#e6edf7;--muted:#9aaccb;--home-soft:#1e3a8a73;--home-ink:#93c5fd;--away-soft:#9a341273;--away-ink:#fdba74;--good:#86efac;--good-soft:#14532d73;--good-line:#15803d;--bad:#fca5a5;--bad-soft:#7f1d1d73;--bad-line:#b91c1c;--serve:#fbbf24;--serve-soft:#78350f80;--floor-a:#8d5c2c;--floor-b:#6e4521;--floor-grain:rgba(0,0,0,.16);--floor-line:#ffffffb3;--kc-bg:#1e2b46;--kc-fg:#dbe6f7;--kc-line:#4b5f86;--shadow:0 1px 2px #0006}
:root[data-theme="dark"] .btn:active:not(:disabled){background:#24324d}
:root[data-theme="dark"] .btn.action.good{background:linear-gradient(180deg,#1b5a36,#14532d73)}
:root[data-theme="dark"] .btn.action.danger{background:linear-gradient(180deg,#7f2323,#7f1d1d73)}
:root[data-theme="dark"] .court-cell{background:#16213aeb}
:root[data-theme="dark"] .court-cell.selected.home{background:var(--home)}
:root[data-theme="dark"] .court-cell.selected.away{background:var(--away)}
:root[data-theme="dark"] .court-pos{color:#fbbf24}
:root[data-theme="dark"] .court-role{--rb:#3b3a1a;--rf:#fde68a}
:root[data-theme="dark"] .court-role[data-r="OH"]{--rb:#1e3a8a;--rf:#bfdbfe}
:root[data-theme="dark"] .court-role[data-r="OP"]{--rb:#7f1d1d;--rf:#fecaca}
:root[data-theme="dark"] .court-role[data-r="MB"]{--rb:#14532d;--rf:#bbf7d0}
:root[data-theme="dark"] .court-role[data-r="S"]{--rb:#4c1d95;--rf:#ddd6fe}
:root[data-theme="dark"] .court-role[data-r="L"]{--rb:#134e4a;--rf:#99f6e4}
:root[data-theme="dark"] .court-sub{background:#2e3a6b;color:#c7d2fe}
:root[data-theme="dark"] .court-sub.locked{background:#334155;color:#cbd5e1}
:root[data-theme="dark"] .zone-label,:root[data-theme="dark"] .fz-info,:root[data-theme="dark"] .court-col-labels,:root[data-theme="dark"] .lineup-cell{color:#fde7c2}
:root[data-theme="dark"] .log-action,:root[data-theme="dark"] td.rate{color:#cbd5e1}
:root[data-theme="dark"] .match-over{background:#0b1220d1}
:root[data-theme="dark"] .vb-err{background:#3b1414;color:#fca5a5}
:root[data-theme="dark"] .kb-key.basic{background:#1e293b;color:#e2e8f0}
:root[data-theme="dark"] .kb-key.attack{background:#312e81;color:#c7d2fe}
:root[data-theme="dark"] .kb-key.control{background:#334155;color:#e2e8f0}
:root[data-theme="dark"] .kb-key.team{background:#78350f;color:#fde68a}
:root[data-theme="dark"] .kb-key.video{background:#134e4a;color:#99f6e4}
:root[data-theme="dark"] .set-history span.home,:root[data-theme="dark"] .set-history span.away{border-color:#475569}
:root[data-theme="dark"] .modal-backdrop{background:#020617a6}
:root[data-theme="dark"] .scoreboard{background:linear-gradient(180deg,var(--surface),var(--surface-2))}
:root[data-theme="dark"] .vb-drop{border-color:#374a70}
</style>
